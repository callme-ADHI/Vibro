name: vibro_v6
description: "VIBRO - AI-Powered Name Detection & Wearable Alert System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Backend & Authentication
  supabase_flutter: ^2.6.0
  
  # BLE Communication
  flutter_blue_plus: ^1.34.5             # ESP32 hardware connection (Central)
  bluetooth_low_energy: ^6.0.3           # Phone-to-phone BLE (Central + Peripheral)
  
  # Audio Recording & Processing
  record: ^6.1.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  permission_handler: ^12.0.1
  
  # ML Inference
  tflite_flutter: ^0.12.1

  # Speech Recognition (blablabala-style detection)
  speech_to_text: ^7.3.0

  # Notifications & Feedback
  flutter_local_notifications: ^18.0.1
  vibration: ^2.0.1
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  http: ^1.2.2
  
  # Navigation
  go_router: ^14.3.0
  
  # UI Enhancements
  shimmer: ^3.0.0
  lottie: ^3.2.0
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
